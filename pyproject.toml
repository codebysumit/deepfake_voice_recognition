[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-voice-recognition"
version = "1.0.0"
description = "End-to-End Deepfake Audio & AI Voice Cloning Detection using Wav2Vec 2.0 and 1D ResNet."
readme = "README.md"
authors = [
    { name = "Deepfake Voice Recognition Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.35.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.2"
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "onnxscript>=0.1.0"
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0"
]

[project.scripts]
deepfake-voice-recognition = "deepfake_voice_recognition.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepfake_voice_recognition*"]
